<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sägewerk App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          background: #1a1a1a;
          color: white;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
        }
        .card {
          background: #2a2a2a;
          border-radius: 16px;
          padding: 32px;
          max-width: 360px;
          text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 20px; margin-bottom: 8px; }
        p { color: #888; font-size: 14px; margin-bottom: 24px; }
        .loader {
          width: 24px;
          height: 24px;
          border: 3px solid #444;
          border-top-color: #4CAF50;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .stores { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .store-btn {
          background: #333;
          color: white;
          text-decoration: none;
          padding: 12px 20px;
          border-radius: 8px;
          font-size: 13px;
        }
        .store-btn:hover { background: #444; }
        #loading { display: block; }
        #fallback { display: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🪵</div>
    <h1>Ketterer Holz</h1>

    <div id="loading">
        <div class="loader"></div>
        <p>App wird geöffnet...</p>
    </div>

    <div id="fallback">
        <p>Installiere die App um diese Maschine anzuzeigen:</p>
        <div class="stores">
            <a href="https://play.google.com/store/apps/details?id=com.saegewerk.app.saege_werk" class="store-btn">
                ▶ Play Store
            </a>
            <a href="https://apps.apple.com/app/id6538727849" class="store-btn">
                App Store
            </a>
        </div>
    </div>
</div>

<script>
    // Nach 2 Sekunden Fallback zeigen
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('fallback').style.display = 'block';
    }, 2000);
</script>
</body>
</html>
